# ============================================================
# application.properties
# Zentrale Einstellungen: Datenbank, Claude-Key, Port.
# Echte Werte kommen aus Umgebungsvariablen (sicherer).
# ============================================================

spring.application.name=shadow-tracker

# --- Datenbank (Supabase Postgres) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# Supabase DB_URL laeuft ueber den PgBouncer-Transaction-Pooler (Port 6543).
# Server-seitige Prepared Statements ueberleben dort keinen Verbindungswechsel
# und kollidieren ("prepared statement already exists") -> deaktivieren.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# schema.sql repariert Alt-Spalten, die ddl-auto=update nicht automatisch
# anpassen konnte. Erst NACH Hibernates eigenem Schema-Update ausfuehren,
# damit die Tabellen bei einer frischen DB schon existieren.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Anthropic (Claude) ---
anthropic.api-key=${ANTHROPIC_API_KEY}

# --- Auth-Token & CORS (kein Login -> Schutz per Secret-Token) ---
# APP_TOKEN hat bewusst KEINEN Default: ohne gesetzte Umgebungsvariable
# startet die App nicht, statt ungeschuetzt hochzufahren.
app.token=${APP_TOKEN}
# FRONTEND_ORIGIN faellt lokal auf localhost:4200 zurueck; in Render/Vercel
# muss die echte Vercel-URL gesetzt werden.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}

# --- Server ---
# Render gibt den Port ueber die Umgebungsvariable PORT vor.
server.port=${PORT:8080}
