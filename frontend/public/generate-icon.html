<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shadow Tracker Icon Generator</title>
</head>
<body style="background:#111; font-family:system-ui, sans-serif; color:#fff; padding:20px;">
<p>Icons are generated below and download automatically. Click a canvas to re-download it.</p>
<div style="display:flex; gap:20px; align-items:flex-end;">
  <canvas id="c512" width="512" height="512"></canvas>
  <canvas id="c192" width="192" height="192"></canvas>
</div>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, size);
  grad.addColorStop(0, '#0d0b08');
  grad.addColorStop(1, '#8a5a10');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 80 / 512);
  ctx.fill();
  ctx.fillStyle = '#f0b84a';
  ctx.font = 'bold ' + Math.round(size * 280 / 512) + 'px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('S', size / 2, size * 270 / 512);
}

function download(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

const c512 = document.getElementById('c512');
const c192 = document.getElementById('c192');
drawIcon(c512, 512);
drawIcon(c192, 192);

c512.addEventListener('click', () => download(c512, 'icon-512.png'));
c192.addEventListener('click', () => download(c192, 'icon-192.png'));

download(c512, 'icon-512.png');
download(c192, 'icon-192.png');
</script>
</body>
</html>
