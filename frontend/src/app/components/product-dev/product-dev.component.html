<div *ngIf="products.length === 0" class="card muted" style="text-align:center;">No won creators yet. Mark a call as Won.</div>

<div *ngFor="let p of products" class="product-wrap">
  <div class="product-header" (click)="toggleProduct(p.id!)">
    <div class="product-meta">
      <div class="product-handle">{{ handleFor(p) }}</div>
      <div class="product-name">{{ p.name || 'Unnamed product' }}</div>
    </div>
    <div class="product-right">
      <span class="phase-badge" [class]="p.stage">{{ p.stage }}</span>
      <span class="toggle-icon">{{ openIds.has(p.id!) ? '−' : '+' }}</span>
    </div>
  </div>
  <div class="section-divider" *ngIf="openIds.has(p.id!)"></div>
  <div class="product-body" [class.open]="openIds.has(p.id!)">
    <input [(ngModel)]="p.name" placeholder="Product name" (blur)="save(p)" style="margin-bottom:8px;" />
    <input [(ngModel)]="p.type" placeholder="Type" (blur)="save(p)" style="margin-bottom:8px;" />

    <!-- Current phase -->
    <div class="phase-bar">
      <span *ngFor="let ph of phases" class="phase-pill" [class.on]="p.stage===ph">{{ ph }}</span>
    </div>

    <!-- Checklist for current phase -->
    <div class="phase-section">
      <div class="phase-head">
        {{ p.stage }} checklist
        <label class="phase-done">
          <input type="checkbox" [checked]="phaseDoneFlag(p, p.stage)" (change)="togglePhaseDone(p, p.stage, $any($event.target).checked)" style="width:auto;" />
          whole phase done
        </label>
      </div>
      <div *ngFor="let i of itemsFor(p, p.stage)" class="check-item">
        <span (click)="toggleItem(p, i)" class="box" [class.on]="i.done">{{ i.done ? '✓' : '' }}</span>
        <span [class.done]="i.done">{{ i.text }}</span>
        <span class="del" (click)="deleteItem(p, i)">×</span>
      </div>
      <div class="add-item">
        <input [(ngModel)]="newItemText[itemKey(p, p.stage)]" placeholder="Add checklist item" (keyup.enter)="addItem(p, p.stage)" />
        <button class="small secondary" (click)="addItem(p, p.stage)">+</button>
      </div>
    </div>

    <button *ngIf="p.stage !== 'launch'" style="margin-top:12px;" (click)="advance(p)">
      Advance to next phase
    </button>

    <!-- Revenue only when live (launch) -->
    <div *ngIf="isLive(p)" class="card revenue">
      <div style="font-size:11px; color:var(--success);">Revenue (Whop)</div>
      <div style="font-size:18px; font-weight:600; color:var(--success);">${{ p.revenue }}</div>
      <div style="font-size:11px; color:var(--success);">{{ p.customers }} customers</div>
    </div>

    <textarea [(ngModel)]="p.problemNotes" placeholder="Notes..." rows="3" (blur)="save(p)" style="margin-top:12px;"></textarea>
  </div>
</div>
